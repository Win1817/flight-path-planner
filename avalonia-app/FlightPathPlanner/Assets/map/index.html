<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Map</title>
  <link rel="stylesheet" href="maplibre-gl.css" />
  <style>
    :root {
      --luna-bg: #0B0A12; --luna-glass: rgba(19, 17, 28, 0.82); --luna-border: rgba(255, 255, 255, 0.12);
      --luna-text: #F8F7FF; --luna-secondary: #A9A5B8; --luna-purple: #8B5CF6; --luna-lavender: #C4B5FD;
    }
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--luna-bg); }
    body { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }

    /* Floating controls: translucent glass, rounded, monochrome glyphs. */
    .maplibregl-ctrl-group {
      background: var(--luna-glass); border: 1px solid var(--luna-border); border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); overflow: hidden;
    }
    .maplibregl-ctrl-group:not(:empty) { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); }
    .maplibregl-ctrl-group button { width: 36px; height: 36px; background-color: transparent; transition: background-color 150ms ease; }
    .maplibregl-ctrl-group button + button { border-top: 1px solid var(--luna-border); }
    .maplibregl-ctrl-group button:hover { background-color: rgba(139, 92, 246, 0.22); }
    .maplibregl-ctrl-group button:focus-visible { outline: 2px solid var(--luna-lavender); outline-offset: -2px; }
    .maplibregl-ctrl button .maplibregl-ctrl-icon { filter: invert(1) opacity(0.85); }
    .maplibregl-ctrl-scale {
      background: var(--luna-glass); color: var(--luna-secondary); border-color: var(--luna-secondary);
      border-radius: 6px; font-size: 11px;
    }
    .maplibregl-ctrl-attrib { background: var(--luna-glass) !important; color: var(--luna-secondary); border-radius: 10px 0 0 0; }
    .maplibregl-ctrl-attrib, .maplibregl-ctrl-attrib-inner { color: var(--luna-secondary) !important; }
    .maplibregl-ctrl-attrib a { color: var(--luna-lavender) !important; }

    /* Hover popup. */
    .maplibregl-popup-content {
      background: rgba(19, 17, 28, 0.94); color: var(--luna-text); border: 1px solid var(--luna-border);
      border-radius: 14px; padding: 10px 14px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    }
    .maplibregl-popup-tip { border-top-color: rgba(19, 17, 28, 0.94) !important; }
    .space-y-1 > * + * { margin-top: 4px; }
    .font-semibold { font-weight: 600; }
    .text-sm { font-size: 13px; }
    .text-xs { font-size: 11px; }
    .font-mono { font-family: ui-monospace, Consolas, monospace; }
    .opacity-70 { opacity: 0.7; }
    .opacity-80 { opacity: 0.8; }
    .flex { display: flex; }
    .gap-3 { gap: 12px; }
    .pt-1 { padding-top: 4px; }
    p { margin: 0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <pre id="err" style="position:absolute;left:12px;top:12px;margin:0;color:#f87171;font:12px monospace;white-space:pre-wrap;z-index:10"></pre>
  <script>
    window.addEventListener('error', function (e) {
      document.getElementById('err').textContent += 'JS error: ' + e.message + ' (' + e.filename + ':' + e.lineno + ')\n';
    });
  </script>
  <script src="maplibre-gl.js"></script>
  <script src="map.js"></script>
</body>
</html>
