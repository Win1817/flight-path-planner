<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Map</title>
  <link rel="stylesheet" href="maplibre-gl.css" />
  <style>
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; }
    .maplibregl-popup-content {
      background: #1a1f2e; color: #e5e7eb; border-radius: 8px; padding: 10px 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5); font-family: system-ui, sans-serif;
    }
    .maplibregl-popup-tip { border-top-color: #1a1f2e !important; }
    .space-y-1 > * + * { margin-top: 4px; }
    .font-semibold { font-weight: 600; }
    .text-sm { font-size: 13px; }
    .text-xs { font-size: 11px; }
    .font-mono { font-family: ui-monospace, monospace; }
    .opacity-70 { opacity: 0.7; }
    .opacity-80 { opacity: 0.8; }
    .flex { display: flex; }
    .gap-3 { gap: 12px; }
    .pt-1 { padding-top: 4px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="maplibre-gl.js"></script>
  <script src="map.js"></script>
</body>
</html>
